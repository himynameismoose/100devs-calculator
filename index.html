<!DOCTYPE html>
<html lang="en">
	<head>
    	<meta charset="utf-8">
    	<meta name="description" content="This is where your description goes">
    	<meta name="keywords" content="one, two, three">

		<title>Title in the tab</title>

		<!-- external CSS link -->
		<link rel="stylesheet" href="css/normalize.css">
		<link rel="stylesheet" href="css/style.css">
	</head>
	<body>

		<section class="calc-bg">
			<section class="calc">
				<input type="text" id="calc-display">
				<section class="calc-buttons">
					<section class="btn-row">
						<span>7</span>
						<span>8</span>
						<span>9</span>
						<span>/</span>
					</section>
					<section class="btn-row">
						<span>4</span>
						<span>5</span>
						<span>6</span>
						<span>x</span>
					</section>
					<section class="btn-row">
						<span>1</span>
						<span>2</span>
						<span>3</span>
						<span>+</span>
					</section>
					<section class="btn-row">
						<span>0</span>
						<span>.</span>
						<span>=</span>
						<span>-</span>
					</section>
				</section>
			</section>
		</section>
		

		<script type="text/javascript" src="js/main.js"></script>
	</body>
</html>
